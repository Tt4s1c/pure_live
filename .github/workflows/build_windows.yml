# =============================================================================
# Pure Live — Windows 构建（免证书 / 无需任何 Secret）
# -----------------------------------------------------------------------------
# 与上游 release.yml 的区别：
#   - 不依赖 CERTIFICATE / KEYSTORE 等任何密钥
#   - 直接 flutter build windows，产出「便携 zip」（已内嵌 VC++ 运行库，解压即跑）
#   - 额外打包一个「自签名 msix」作为安装包备用（安装前需信任该自签名证书）
# 触发方式：
#   1. 推送到 master/main 分支自动构建
#   2. 在 GitHub 仓库 Actions 页面手动 Run workflow
# 产物：在 Actions 运行结果的 Artifacts 中下载
# =============================================================================

name: Build Windows (No-Cert)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 3.47.0（Dart 3.13.0，满足 windows_single_instance 插件 >=3.11.0 的约束）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 拉取依赖
        run: flutter pub get

      # 注：本项目已把生成的 *.g.dart（如 database.g.dart）提交进仓库，
      # 无需 build_runner 重新生成，故省略该步骤（避免 analyzer 版本冲突报错）。

      - name: 编译 Windows Release
        run: flutter build windows --release

      - name: 将 VC++ 运行库打入 Release（让便携包自包含，免去目标机装 VC++ 2022 可再发行包）
        shell: pwsh
        continue-on-error: true   # 即使找不到 VC++ 运行库也不阻断打包，仅影响便携包在干净机器上的直接运行
        run: |
          # 用官方 vswhere 定位 VS 安装路径（兼容 Enterprise/Community/BuildTools、各盘符、不同年版本）
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          }
          # 兜底：扫描常见安装目录
          if (-not $vsPath) {
            $candidates = @(
              "C:\Program Files\Microsoft Visual Studio\2022",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
              "C:\Program Files\Microsoft Visual Studio\2022\Community",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $vsPath = $c; break }
            }
          }
          if (-not $vsPath) {
            Write-Warning "未找到 Visual Studio，跳过 VC++ 运行库打包（便携包可能需目标机安装 VC++ 2022 可再发行包）"
            exit 0
          }
          # 进入 VC/Redist/MSVC/<ver>/x64/Microsoft.VC143.CRT
          $redist = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $redist)) {
            Write-Warning "未找到 VC Redist 目录: $redist"
            exit 0
          }
          $ver = Get-ChildItem $redist -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Join-Path $ver.FullName "x64\Microsoft.VC143.CRT"
          if (Test-Path $crt) {
            Copy-Item "$crt\*" "build\windows\x64\runner\Release" -Force
            Write-Host "已从 $crt 复制 VC++ 运行库"
          } else {
            Write-Warning "未找到 VC++ CRT: $crt（便携包可能需目标机安装 VC++ 2022 可再发行包）"
          }

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          foreach ($line in (Get-Content pubspec.yaml)) {
            if ($line -match 'version:\s*(\d+(?:\.\d+)+)') {
              $v = $matches[1]
              "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "version=$v"
              break
            }
          }

      - name: 打包便携 zip
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "PureLive-$ver-windows-x64-portable.zip"
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          Write-Host "已生成 $zip"

      - name: 生成自签名证书并打包 msix（备用，失败不阻断整体）
        shell: pwsh
        continue-on-error: true
        run: |
          $pw   = "pure_live_ci_$(Get-Random)"
          $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=pure_live" -CertStoreLocation "cert:\CurrentUser\My"
          $pfx  = "ci_cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $pw -Force -AsPlainText)
          dart run msix:create --certificate $pfx --certificate-password $pw --signtool-options "/td SHA256"

      - name: 收集 msix 产物
        id: msix
        shell: pwsh
        continue-on-error: true
        run: |
          $m = Get-ChildItem "build\windows\x64\runner\Release" -Filter "*.msix" | Select-Object -First 1
          if ($m) {
            $dst = "PureLive-${{ steps.version.outputs.version }}-windows-x64.msix"
            Copy-Item $m.FullName $dst -Force
            "msix=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "msix=$dst"
          } else {
            Write-Host "未生成 msix（可忽略，便携 zip 仍可用）"
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-windows
          path: |
            PureLive-*-windows-x64-portable.zip
            PureLive-*-windows-x64.msix
          if-no-files-found: warn
          retention-days: 30
